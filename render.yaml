services:
  - type: web
    name: combined-anime-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    disk:
      name: anime-bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MAIN_CHANNEL_ID
        sync: false
      - key: SOURCE_CHANNEL_IDS
        sync: false
      - key: SOURCE_CHANNEL_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_PATH
        value: /var/data/anime_channels.sqlite3
