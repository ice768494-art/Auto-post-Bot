services:
  - type: worker
    name: anime-auto-post-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: MONGODB_URI
        sync: false

      - key: MONGODB_DATABASE
        value: anime_auto_post_bot

      - key: MAIN_CHANNEL_ID
        sync: false

      - key: SOURCE_CHANNEL_IDS
        sync: false

      - key: SOURCE_CHANNEL_ID
        sync: false

      - key: ADMIN_IDS
        sync: false

      - key: MIGRATE_SQLITE
        value: "true"

      - key: PORT
        value: "10000"
